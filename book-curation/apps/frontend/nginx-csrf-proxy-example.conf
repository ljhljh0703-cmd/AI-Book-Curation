server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CSRF 수정:
    # React가 /api/... 로 요청하면 NAS의 Spring Boot 백엔드 포트로 프록시합니다.
    # 브라우저 기준 요청 URL은 http://192.168.0.10:39080/api/... 로 유지됩니다.
    location /api/ {
        proxy_pass http://192.168.0.10:38080/api/;
        proxy_http_version 1.1;

        # CSRF 수정: 원 요청의 Origin/Cookie/Header를 백엔드로 전달합니다.
        proxy_set_header Host $host:$server_port;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass_request_headers on;
    }

    # CSRF 수정: OAuth 로그인도 같은 프론트 포트에서 백엔드로 프록시합니다.
    location /oauth2/ {
        proxy_pass http://192.168.0.10:38080/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass_request_headers on;
    }

    location /login/oauth2/ {
        proxy_pass http://192.168.0.10:38080/login/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass_request_headers on;
    }
}
