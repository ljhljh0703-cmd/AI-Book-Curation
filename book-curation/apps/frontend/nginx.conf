server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 수정 포인트: 프론트 정적 리소스 응답에 기본 보안 헤더를 추가합니다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 수정 포인트: 강한 CSP는 외부 이미지/소셜 로그인 흐름을 깨뜨릴 수 있어 먼저 Report-Only로 관찰합니다.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://book.taeo-dev.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
