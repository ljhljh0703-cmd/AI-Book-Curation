spec:
  inputs:
    deploy-service:
      description: "Service to deploy when running a manual deploy-only pipeline."
      default: "none"
      options:
        - "none"
        - "ai-server"
    deploy-target:
      description: "Deployment target for a manual deploy-only pipeline."
      default: "none"
      options:
        - "none"
        - "nas"
        - "aws"
    deploy-image-override:
      description: "Existing image to deploy instead of the current commit tag."
      default: ""
---

variables:
  FF_TIMESTAMPS: "false"
  K8S_NAMESPACE: "book-curation-dev"
  KUBECTL_IMAGE: "registry.k8s.io/kubectl:v1.30.0"
  DOCKER_BUILDKIT: "1"
  K8S_ROLLOUT_TIMEOUT: "300s"
  AUTO_ROLLOUT_UNDO: "true"
  DEPLOY_SERVICE: "$[[ inputs.deploy-service ]]"
  DEPLOY_TARGET: "$[[ inputs.deploy-target ]]"
  DEPLOY_IMAGE_OVERRIDE: "$[[ inputs.deploy-image-override ]]"

# Runner tag policy
# - dev branch: NAS runner only
# - aws-dev / team/* branches: AWS runner only
# Configure GitLab Runner tags as follows:
# - NAS runner: book-curation-api
# - AWS runner: book-curation-aws-build, book-curation-aws-deploy
# CI changes are included in service rules while CI/CD is being stabilized.
# Remove .gitlab-ci.yml from service changes later if validation-only behavior is desired.

default:
  before_script:
    - export TZ=Asia/Seoul
    - 'echo "[KST] job start: $(date ''+%Y-%m-%d %H:%M:%S %Z'')"'

stages:
  - validate
  - build
  - deploy

validate_ci_config_nas_dev:
  stage: validate
  image: alpine:3.20
  tags:
    - book-curation-api
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never
  script:
    - echo "[VALIDATE] NAS dev pipeline"
    - echo "[VALIDATE] dev branch will build on NAS runner and deploy to NAS k3s"

validate_ci_config_aws_dev:
  stage: validate
  image: alpine:3.20
  tags:
    - book-curation-aws-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "aws-dev"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^team\/.*$/'
      when: always
    - when: never
  script:
    - echo "[VALIDATE] AWS team dev pipeline"
    - echo "[VALIDATE] aws-dev/team/* branches will build and deploy on AWS runner"

.build_image_template:
  stage: build
  image: docker:27-cli
  before_script:
    - export TZ=Asia/Seoul
    - 'echo "[KST] job start: $(date ''+%Y-%m-%d %H:%M:%S %Z'')"'
    - docker version
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - export BUILDX_BUILDER_NAME="book-curation-${CI_PROJECT_ID:-local}-builder"
    - docker buildx version
    - docker buildx inspect "$BUILDX_BUILDER_NAME" >/dev/null 2>&1 || docker buildx create --name "$BUILDX_BUILDER_NAME" --driver docker-container --use
    - docker buildx use "$BUILDX_BUILDER_NAME"
    - docker buildx inspect --bootstrap
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_LATEST_TAG="${CI_COMMIT_REF_SLUG}-latest"
    - echo "[IMAGE TAG] $IMAGE_TAG"

.nas_build_rules_backend:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - apps/backend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.aws_build_rules_backend:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "aws-dev"'
      changes:
        - apps/backend/**/*
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^team\/.*$/'
      changes:
        - apps/backend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.nas_build_rules_frontend:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - apps/frontend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.aws_build_rules_frontend:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "aws-dev"'
      changes:
        - apps/frontend/**/*
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^team\/.*$/'
      changes:
        - apps/frontend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.nas_build_rules_ai_server:
