      changes:
        - apps/ai-server/**/*
        - packages/prompts/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.aws_build_rules_ai_server:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "aws-dev"'
      changes:
        - apps/ai-server/**/*
        - packages/prompts/**/*
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^team\/.*$/'
      changes:
        - apps/ai-server/**/*
        - packages/prompts/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.nas_build_rules_gte:
