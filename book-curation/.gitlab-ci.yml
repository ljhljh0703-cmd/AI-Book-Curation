.deploy_k3s_template:
  stage: deploy
  image: docker:27-cli
  before_script:
    - export TZ=Asia/Seoul
    - 'echo "[KST] job start: $(date ''+%Y-%m-%d %H:%M:%S %Z'')"'
    - docker version
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - export EFFECTIVE_K8S_NAMESPACE="${TARGET_K8S_NAMESPACE:-${K8S_NAMESPACE:-book-curation-dev}}"
    - export EFFECTIVE_KUBECONFIG_PATH="${TARGET_KUBECONFIG_PATH:-/etc/rancher/k3s/k3s.yaml}"
    - export EFFECTIVE_ROLLOUT_TIMEOUT="${K8S_ROLLOUT_TIMEOUT:-300s}"
    - export REGISTRY_PULL_SECRET_NAME="${REGISTRY_PULL_SECRET_NAME:-gitlab-registry-pull}"
    - export EFFECTIVE_REGISTRY_PULL_USER="${REGISTRY_PULL_USER:-$CI_REGISTRY_USER}"
    - export EFFECTIVE_REGISTRY_PULL_PASSWORD="${REGISTRY_PULL_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - export EFFECTIVE_DEPLOY_IMAGE="${DEPLOY_IMAGE_OVERRIDE:-$DEPLOY_IMAGE}"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ -n "${DEPLOY_IMAGE_OVERRIDE:-}" ]; then
        echo "[DEPLOY][ERROR] DEPLOY_IMAGE_OVERRIDE must not be used in push pipelines."
        echo "[DEPLOY][ERROR] DEPLOY_IMAGE_OVERRIDE=$DEPLOY_IMAGE_OVERRIDE"
        exit 1
      fi
    - echo "[DEPLOY TARGET] namespace=$EFFECTIVE_K8S_NAMESPACE kubeconfig=$EFFECTIVE_KUBECONFIG_PATH deployment=$K8S_DEPLOYMENT container=$K8S_CONTAINER timeout=$EFFECTIVE_ROLLOUT_TIMEOUT"
  script:
    - echo "[DEPLOY] preflight registry image exists -> $EFFECTIVE_DEPLOY_IMAGE"
    - docker manifest inspect "$EFFECTIVE_DEPLOY_IMAGE" >/dev/null
    - echo "[DEPLOY] check target nodes"
    - |
      docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        get nodes -o wide
    - echo "[DEPLOY] check target deployments"
    - |
      docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        get deploy -o wide
    - echo "[DEPLOY] ensure registry pull secret -> $REGISTRY_PULL_SECRET_NAME"
    - |
      docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        create secret docker-registry "$REGISTRY_PULL_SECRET_NAME" \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$EFFECTIVE_REGISTRY_PULL_USER" \
        --docker-password="$EFFECTIVE_REGISTRY_PULL_PASSWORD" \
        --dry-run=client \
        -o yaml | docker run --rm -i \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        apply -f -
    - echo "[DEPLOY] attach registry pull secret to $K8S_DEPLOYMENT"
    - |
      docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        patch deployment "$K8S_DEPLOYMENT" \
        --type=strategic \
        -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"$REGISTRY_PULL_SECRET_NAME\"}]}}}}"
    - echo "[DEPLOY] set image $K8S_DEPLOYMENT/$K8S_CONTAINER -> $EFFECTIVE_DEPLOY_IMAGE"
    - |
      docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$EFFECTIVE_DEPLOY_IMAGE"
    - echo "[DEPLOY] wait rollout $K8S_DEPLOYMENT"
    - |
      if ! docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        rollout status "deployment/$K8S_DEPLOYMENT" --timeout="$EFFECTIVE_ROLLOUT_TIMEOUT"; then
        echo "[DEPLOY][ERROR] rollout failed. Collecting diagnostics..."
        docker run --rm \
          --user 0:0 \
          --network host \
          -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
          "$KUBECTL_IMAGE" \
          --kubeconfig=/kubeconfig \
          -n "$EFFECTIVE_K8S_NAMESPACE" \
          get pods -o wide || true
        docker run --rm \
          --user 0:0 \
          --network host \
          -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
          "$KUBECTL_IMAGE" \
          --kubeconfig=/kubeconfig \
          -n "$EFFECTIVE_K8S_NAMESPACE" \
          describe deployment "$K8S_DEPLOYMENT" || true
        docker run --rm \
          --user 0:0 \
          --network host \
          -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
          "$KUBECTL_IMAGE" \
          --kubeconfig=/kubeconfig \
          -n "$EFFECTIVE_K8S_NAMESPACE" \
          describe pods || true
        docker run --rm \
          --user 0:0 \
          --network host \
          -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
          "$KUBECTL_IMAGE" \
          --kubeconfig=/kubeconfig \
          -n "$EFFECTIVE_K8S_NAMESPACE" \
          get events --sort-by=.lastTimestamp | tail -80 || true
        echo "[DEPLOY] rolling back $K8S_DEPLOYMENT"
        docker run --rm \
          --user 0:0 \
          --network host \
          -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
          "$KUBECTL_IMAGE" \
          --kubeconfig=/kubeconfig \
          -n "$EFFECTIVE_K8S_NAMESPACE" \
          rollout undo "deployment/$K8S_DEPLOYMENT" || true
        docker run --rm \
          --user 0:0 \
          --network host \
          -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
          "$KUBECTL_IMAGE" \
          --kubeconfig=/kubeconfig \
          -n "$EFFECTIVE_K8S_NAMESPACE" \
          rollout status "deployment/$K8S_DEPLOYMENT" --timeout="$EFFECTIVE_ROLLOUT_TIMEOUT" || true
        exit 1
      fi
    - echo "[DEPLOY] assert current image"
    - |
      CURRENT_IMAGE="$(docker run --rm \
        --user 0:0 \
        --network host \
        -v "$EFFECTIVE_KUBECONFIG_PATH:/kubeconfig:ro" \
        "$KUBECTL_IMAGE" \
        --kubeconfig=/kubeconfig \
        -n "$EFFECTIVE_K8S_NAMESPACE" \
        get deploy "$K8S_DEPLOYMENT" \
        -o jsonpath='{.spec.template.spec.containers[0].image}')"
      echo "[DEPLOY] current image=$CURRENT_IMAGE"
      echo "[DEPLOY] expected image=$EFFECTIVE_DEPLOY_IMAGE"
      if [ "$CURRENT_IMAGE" != "$EFFECTIVE_DEPLOY_IMAGE" ]; then
        echo "[DEPLOY][ERROR] deployed image mismatch"
        exit 1
      fi

.nas_deploy_rules_backend:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - apps/backend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.aws_deploy_rules_backend:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "aws-dev"'
      changes:
