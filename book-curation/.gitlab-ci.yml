    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^team\/.*$/'
      changes:
        - apps/kure-embedding-server/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

build_backend_image_nas_dev:
  extends:
    - .build_image_template
    - .nas_build_rules_backend
  tags:
    - book-curation-api
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
  script:
    - echo "[BUILD][NAS] backend image"
    - |
      docker buildx build \
        --cache-from "type=registry,ref=$IMAGE_NAME:buildcache" \
        --cache-to "type=registry,ref=$IMAGE_NAME:buildcache,mode=min" \
        -f apps/backend/Dockerfile \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:$IMAGE_LATEST_TAG" \
        --push \
        apps/backend
    - echo "[DONE] $IMAGE_NAME:$IMAGE_TAG pushed"

