<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>북켓몬 피치 비디오 플레이어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-orange: #ff6b3d;
      --brand-blue: #0f172a;
      --shadow-premium: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* 프리미엄 헤더 */
    header {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .concept-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--brand-orange);
      background: rgba(255, 107, 61, 0.08);
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 500px;
      line-height: 1.5;
    }

    /* 메인 플레이어 컨테이너 */
    .player-container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-premium);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-bottom: 40px;
    }

    /* 비디오 엘리먼트 */
    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      aspect-ratio: 16 / 9;
      outline: none;
    }

    /* 푸터 피드백 안내 */
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      animation: fadeIn 1s ease forwards;
    }

    /* 애니메이션 */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <span class="concept-tag">Bookemon Keynote Video</span>
    <h1>북켓몬 피치 데모 비디오</h1>
    <p class="subtitle">문장 단위 동기화 및 고품질 사운드 믹싱이 완벽히 완료된 최종 결과물입니다.</p>
  </header>

  <div class="player-container">
    <video controls autoplay playsinline preload="metadata" name="media">
      <!-- 브라우저 물리적 디스크 캐시를 완전히 패스하기 위해 유니크하게 작명된 최종 비디오 v4 파일명 명시 -->
      <source src="bookemon_pitch_final_v4.mp4" type="video/mp4">
      브라우저가 비디오 재생을 지원하지 않습니다.
      <a href="bookemon_pitch_final_v4.mp4">bookemon_pitch_final_v4.mp4</a>를 직접 열어 주세요.
    </video>
  </div>

  <footer>
    © 2026 Bookemon Team. All Rights Reserved. macOS Chrome / Safari 최적화.
  </footer>

</body>
</html>
